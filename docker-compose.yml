services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spendwise
      POSTGRES_USER: spendwise
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spendwise_local_only}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U spendwise -d spendwise"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://spendwise:${DB_PASSWORD:-spendwise_local_only}@db:5432/spendwise
      JWT_SECRET: ${JWT_SECRET:-local-spendwise-dev-secret-change-before-deployment}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4000}
    command: sh -c "node server/migrate.js && node server/seed.js && node server/src/index.js"
    depends_on:
      db: {condition: service_healthy}
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
volumes:
  pgdata:


